<!doctype html>
<!--
  The script box: Monaco editing an SPSL or Rhai script (with its colours) or plain lines to send, for Edit Button and the
  Script Editor (src/lib/scripting/ScriptBox.svelte). In an iframe of its own, as Highlighted Output is, so Monaco's
  loader stays out of the main window. script.js talks to the window through host/webview.js: the window sends the
  text, the language, Wrap and light or dark (with a theme of the user's own's colours); the page sends each change of
  the text back.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; worker-src 'self' blob:">
<title>Script</title>
<link rel="stylesheet" data-name="vs/editor/editor.main" href="../lib/monaco/vs/editor/editor.main.css">
<style>
  /* the editor fills the frame; the frame's size is the dialog's to set */
  html, body, #editor { margin: 0; height: 100%; overflow: hidden; }
</style>
</head>
<body>
<div id="editor"></div>
<!-- SuperXTerminal: the main window's messages, as WebView2's chrome.webview -->
<script src="../host/webview.js"></script>
<script src="../lib/monaco/vs/loader.js"></script>
<script src="script.js"></script>
</body>
</html>
