[package]
name = "superxterminal"
version = "0.1.0"
description = "A macOS counterpart of SuperXPuTTY"
authors = ["waukeerules"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "superxterminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
portable-pty = "0.9"
base64 = "0.23"
# serial ports driven directly (termios), rather than the MPL-licensed serialport crate
libc = "0.2"
quick-xml = "0.42"
tauri-plugin-dialog = "2"
dirs = "7"
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
tokio = { version = "1", features = ["time"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"

# the main window's WebKit settings (Writing Tools off), as Tauri itself uses them
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSValue", "NSKeyValueCoding"] }
objc2-web-kit = { version = "0.3", features = ["WKWebViewConfiguration"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
