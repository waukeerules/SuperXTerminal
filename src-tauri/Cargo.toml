[package]
name = "superxterminal"
version = "0.8.7"
description = "Terminal and session manager for teams looking after servers and network devices"
authors = ["waukeerules"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "superxterminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
portable-pty = "0.9"
base64 = "0.23"
# serial ports driven directly (termios), rather than the MPL-licensed serialport crate
libc = "0.2"
quick-xml = "0.42"
tauri-plugin-dialog = "2"
dirs = "7"
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
tokio = { version = "1", features = ["time", "rt", "net", "process", "io-util", "sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
ironrdp-client = { version = "0.1", features = ["native-tls", "sound", "clipboard", "gateway"] }
ironrdp-pdu = "0.9"
ironrdp-graphics = "0.9"
smallvec = "1"
ironrdp-cliprdr = "0.7"
ironrdp-core = "0.2"
# this computer's drives in the remote desktop (rdp_drives.rs): the device channel, the messages it answers with,
# and the sound channel Windows wants beside it (the versions ironrdp-client itself uses)
ironrdp-rdpdr = "0.7"
ironrdp-svc = "0.8"
ironrdp-rdpsnd = "0.9"
# Remote Desktop's sound (rdp_sound.rs): IronRDP's decoding and its stream to the speakers, and cpal to start that
# stream, which IronRDP's own handler doesn't (the versions ironrdp-client itself uses)
ironrdp-rdpsnd-native = "0.7"
cpal = "0.17"
# the connection sequence itself, which rdp.rs's tests drive with a terminal server's PDUs (licensing, probes)
ironrdp-connector = "0.10"
russh-sftp = "3.0.1"
futures-util = "0.3"
tauri-plugin-window-state = "2"
# Rhai scripts, beside SPSL (rhai_scripts.rs). "internals" for Check script: it walks a compiled script for the
# functions it calls (AST::walk) and lists the engine's (collect_fn_metadata), to name a misspelt one before it runs
rhai = { version = "1.27.0", features = ["internals"] }

# Ctrl+C for local shells (console.rs), the login helper finding ssh (askpass.rs), COM ports (streams.rs), the menus' theme (lib.rs),
# and the clipboard for a paste (clipboard.rs)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_Devices_Communication", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }
# the login helper's tokens (askpass.rs)
getrandom = "0.3"
# the taskbar pins' shortcuts, read and written through the shell's COM objects (pins.rs). The version Tauri already uses
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }

# Linux's clipboard (X11, or Wayland's data-control where the desktop has it), for a paste and for Remote Desktop's
# clipboard (clipboard.rs). Text only: its picture support would bring an image library along
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

# the main window's WebKit settings (Writing Tools off), as Tauri itself uses them
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSValue", "NSKeyValueCoding"] }
objc2-web-kit = { version = "0.3", features = ["WKWebViewConfiguration"] }
# the Mac clipboard, for Remote Desktop's clipboard (rdp_clipboard.rs) and a paste (clipboard.rs)
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSEvent", "block2"] }
block2 = "0.6"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# the RDP client decodes every screen update: optimised even in development builds, or remote desktops crawl
[profile.dev.package.ironrdp-graphics]
opt-level = 3
[profile.dev.package.ironrdp-client]
opt-level = 3
[profile.dev.package.ironrdp-pdu]
opt-level = 3

# IronRDP's connection sequence with one fix not yet published: a Windows Server 2022 terminal server's network probe
# (an Auto-Detect Request) in the middle of licensing, or before its capabilities, ended the connection with "invalid
# securityHeaderFlags" (IronRDP #1629, fixed by #2128). patches/ironrdp-connector is 0.10.0 with that fix
# backported; README.SuperXTerminal.md there says what changed. Drop it once a release of ironrdp-client takes a
# connector with the fix.
[patch.crates-io]
ironrdp-connector = { path = "patches/ironrdp-connector" }
