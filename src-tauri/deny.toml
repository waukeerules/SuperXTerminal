# cargo-deny: licences, security advisories and crate sources for the Rust core.
# The allowed licences match scripts/check-licenses.mjs (docs/PLAN.md §1 Licensing). Run `cargo deny check` here.

[graph]
all-features = false

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "0BSD",
  "Unicode-3.0",
  "MPL-2.0",
]
confidence-threshold = 0.9
# the list is shared with the npm check, so not every licence appears on the Rust side
unused-allowed-license = "allow"

# Boost-licensed, and never built into SuperXTerminal: arboard (Linux's clipboard, clipboard.rs) is a dependency on
# Linux alone, and these two are arboard's on Windows alone. They're only in Cargo.lock, which lists every system's
# crates, and this check can't tell that the two conditions never hold together. Not a licence added to the list
# above: any other Boost-licensed crate still fails.
[[licenses.exceptions]]
allow = ["BSL-1.0"]
crate = "clipboard-win"

[[licenses.exceptions]]
allow = ["BSL-1.0"]
crate = "error-code"

[advisories]
# unmaintained crates deep in Tauri's tree are reported, not failed; vulnerabilities still fail
unmaintained = "none"
# Each advisory let through is also in docs/DEPENDENCIES.md ("What's set aside"): keep the two the same.
ignore = [
  # The Marvin attack: timing that leaks an RSA private key while it decrypts, in the rsa crate, which has no fixed
  # version. It comes in through IronRDP (picky, sspi, winscard). The Remote Desktop client only encrypts to the
  # server's public key (NLA's CredSSP); it never decrypts or signs with a private RSA key of its own, as smart card
  # logins, the one path that would, aren't used. Look again when rsa 0.10 is released or IronRDP moves on.
  { id = "RUSTSEC-2023-0071", reason = "rsa has no fix; IronRDP's client uses only the server's public key" },
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
